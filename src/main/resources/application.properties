spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình Cloudinary
cloudinary.cloud_name=dudtrotnp
cloudinary.api_key=123456789012345
cloudinary.api_secret=abcdefghijklmnopqrstuvwxyz12

# Cấu hình Spring Mail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Điền email thật của bạn
spring.mail.username=your_email@gmail.com
# Điền MẬT KHẨU ỨNG DỤNG 16 KÝ TỰ tạo từ Google Account (Security -> 2-Step Verification -> App Passwords)
spring.mail.password=your_16_digit_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true